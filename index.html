<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connect — Rohith Uppunuthula</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f3f3f0;
      --surface: #ffffff;
      --border: #e2e2de;
      --border-focus: #b8b8b2;
      --text: #1a1a18;
      --muted: #8f8f8a;
      --faint: #f9f9f7;
      --green: #2d6a4f;
      --accent-line: #1a1a18;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'Geist Mono', 'Courier New', monospace;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* FIX 5: anchor to top, not float center — more grounded */
      align-items: center;
      justify-content: flex-start;
      padding: 5vh 1.25rem 4rem;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      animation: up 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HEADER ── */
    .header {
      margin-bottom: 2.8rem;
      /* FIX 5: padding top so form feels anchored */
      padding-top: 1rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      /* FIX 10: legible font sizes */
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }

    .dot {
      width: 6px; height: 6px;
      background: #4caf72;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6vw, 3rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.08;
      color: var(--text);
      margin-bottom: 1.1rem;
      letter-spacing: -0.02em;
    }

    /* FIX 7: links with separators and better spacing */
    .links {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
      padding: 0.2rem 0;
    }

    .links a:hover { color: var(--text); }

    .links .sep {
      color: var(--border);
      margin: 0 0.7rem;
      user-select: none;
    }

    /* ── FORM CARD ── */
    /* FIX 11: shadow for depth, separation from bg */
    .form-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 1.5rem;
      margin-bottom: 1.1rem;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 4px 16px rgba(0,0,0,0.06),
        0 1px 0 rgba(255,255,255,0.8) inset;
    }

    /* FIX 4 + 9: focus state with left accent line per row */
    .notion-row {
      display: grid;
      /* FIX 3: wider label column, more breathing room */
      grid-template-columns: 100px 1fr;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background 0.12s;
    }

    .notion-row:last-child { border-bottom: none; }

    /* FIX 9: left accent bar on focus */
    .notion-row::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent-line);
      border-radius: 2px 0 0 2px;
      opacity: 0;
      transform: scaleY(0.4);
      transition: opacity 0.15s, transform 0.15s;
    }

    .notion-row:focus-within::before {
      opacity: 1;
      transform: scaleY(1);
    }

    /* FIX 4: subtle background tint on active row */
    .notion-row:focus-within {
      background: var(--faint);
    }

    .notion-row:focus-within .lbl {
      color: var(--text);
    }

    /* FIX 10: legible label size */
    .lbl {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      display: flex;
      align-items: flex-start;
      padding-top: 1rem;
      padding-right: 0.75rem;
      /* FIX 3: no longer cramped */
      padding-left: 0.5rem;
      transition: color 0.15s;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
    }

    .f {
      font-family: var(--mono);
      /* FIX 10: comfortable reading size */
      font-size: 0.82rem;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      padding: 0.88rem 0.5rem 0.88rem 0;
      width: 100%;
      resize: none;
      line-height: 1.6;
    }

    .f::placeholder { color: #d0d0cc; }

    textarea.f {
      min-height: 114px;
    }

    .sel-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .sel-wrap::after {
      content: '⌄';
      position: absolute;
      right: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      pointer-events: none;
      line-height: 1;
    }

    select.f {
      padding-right: 1.5rem;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    select.f option { background: var(--surface); }

    /* ── BOTTOM ROW ── */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .note {
      /* FIX 10: min legible size */
      font-size: 0.64rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .note a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 0.15s, border-color 0.15s;
    }

    .note a:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* FIX 8: bigger, more confident button */
    .btn {
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--surface);
      background: var(--text);
      border: none;
      border-radius: 6px;
      /* FIX 8: generous padding */
      padding: 0.72rem 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 1;
      box-shadow: 0 4px 14px rgba(26,26,24,0.22);
      transform: translateY(-1px);
    }

    .btn:active { transform: scale(0.97) translateY(0); box-shadow: none; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

    .arr { transition: transform 0.2s; display: inline-block; }
    .btn:hover .arr { transform: translate(2px, -2px); }

    .spin {
      display: none;
      width: 12px; height: 12px;
      border: 1.5px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SUCCESS ── */
    .success {
      display: none;
      padding: 2.5rem 0 1rem;
      animation: up 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .s-mark {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }

    .s-mark::before {
      content: '✓';
      width: 18px; height: 18px;
      background: var(--green);
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      flex-shrink: 0;
    }

    .success h2 {
      font-family: var(--serif);
      font-size: 2.2rem;
      font-weight: 400;
      font-style: italic;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }

    .success p {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.75;
    }

    /* FIX 6: proper breathing room for footer */
    .footer {
      margin-top: 2.8rem;
      font-size: 0.64rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 2;
      padding-top: 1.8rem;
      border-top: 1px solid var(--border);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover { color: var(--text); }

    @media (max-width: 440px) {
      body { padding: 3vh 1rem 3rem; }
      h1 { font-size: 2.1rem; }
      .notion-row { grid-template-columns: 80px 1fr; }
      .lbl { font-size: 0.62rem; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="header">
    <div class="status"><span class="dot"></span> available for remote</div>
    <h1>Say hello.</h1>
    <div class="links">
      <a href="https://x.com/BruntEngineer" target="_blank">@BruntEngineer</a>
      <span class="sep">·</span>
      <a href="https://linkedin.com/in/rohith-uppunuthula" target="_blank">LinkedIn</a>
      <span class="sep">·</span>
      <a href="https://github.com/U-ROHITH" target="_blank">GitHub</a>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="success" id="success">
    <div class="s-mark">Sent</div>
    <h2>Message received.</h2>
    <p>I'll get back to you soon.</p>
  </div>

  <!-- FORM -->
  <div id="formBlock">
    <form id="form">
      <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY"/>
      <input type="hidden" name="subject" value="New message — rohithpatel.com"/>
      <input type="checkbox" name="botcheck" style="display:none"/>

      <div class="form-wrap">

        <div class="notion-row">
          <div class="lbl">Name</div>
          <input class="f" type="text" name="name" placeholder="Your name" required autocomplete="name"/>
        </div>

        <div class="notion-row">
          <div class="lbl">Email</div>
          <input class="f" type="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
        </div>

        <!-- FIX 1: "Re" → "Reason" (full label, no ambiguity) -->
        <div class="notion-row">
          <div class="lbl">Reason</div>
          <div class="sel-wrap">
            <select class="f" name="reason" required>
              <option value="" disabled selected>Why are you reaching out?</option>
              <option value="remote-job">Remote job opportunity</option>
              <option value="collaboration">Collaboration</option>
              <option value="100days">100 Days AI/ML</option>
              <option value="freelance">Freelance</option>
              <option value="hi">Just saying hi</option>
            </select>
          </div>
        </div>

        <!-- FIX 2: "Note" → "Message" -->
        <div class="notion-row">
          <div class="lbl">Message</div>
          <textarea class="f" name="message" placeholder="Your message..." required></textarea>
        </div>

      </div>

      <div class="bottom">
        <span class="note">via <a href="https://web3forms.com" target="_blank">web3forms</a></span>
        <button type="submit" class="btn" id="btn">
          <span id="btnTxt">Send message</span>
          <span class="arr" id="btnArr">↗</span>
          <div class="spin" id="spin"></div>
        </button>
      </div>
    </form>
  </div>

  <!-- FIX 6: footer separated with border + proper margin -->
  <div class="footer">
    Rohith Uppunuthula · Warangal, India ·
    <a href="mailto:uppunuthula.rohith@gmail.com">uppunuthula.rohith@gmail.com</a>
  </div>

</div>

<script>
  const form      = document.getElementById('form');
  const btn       = document.getElementById('btn');
  const txt       = document.getElementById('btnTxt');
  const arr       = document.getElementById('btnArr');
  const spin      = document.getElementById('spin');
  const success   = document.getElementById('success');
  const formBlock = document.getElementById('formBlock');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    txt.textContent = 'Sending';
    arr.style.display = 'none';
    spin.style.display = 'block';

    try {
      const res  = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const json = await res.json();
      if (json.success) {
        formBlock.style.display = 'none';
        success.style.display = 'block';
      } else throw new Error();
    } catch {
      txt.textContent = 'Try again';
      arr.style.display = 'inline';
      spin.style.display = 'none';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
